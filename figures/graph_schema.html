<!doctype html>
<html><head><meta charset="utf-8">
<style>
  :root{ --mut:#6c757d; --teal:#2f9e8c; --coral:#c75d62; --purp:#8a6fb0; --slate:#7a8aa0; }
  *{ box-sizing:border-box; }
  body{ margin:0; background:#eef1f5; font-family:'Helvetica Neue',Arial,'Liberation Sans',sans-serif; }
  #wrap{ width:1120px; background:#fff; padding:28px 30px 26px; }
  h1{ text-align:center; font-size:29px; color:#222; margin:2px 0 2px; }
  .sub{ text-align:center; color:var(--mut); font-size:14.5px; margin:0 0 4px; }
  svg{ width:100%; height:560px; display:block; }
  .nl{ fill:#fff; font-weight:700; text-anchor:middle; dominant-baseline:central; }
  .nsub{ fill:#eef1f4; text-anchor:middle; dominant-baseline:central; }
  .flabel{ fill:#2f7d6f; font-size:12px; text-anchor:middle; }
  .edge{ stroke:#c2c9d3; stroke-width:2.6; fill:none; }
  .fedge{ stroke:#86c7bc; stroke-width:2; fill:none; }
  .elabel{ fill:var(--mut); font-size:13px; font-style:italic; text-anchor:middle; }
  .kgtitle{ fill:#75599c; font-size:15px; font-weight:700; text-anchor:middle; }
</style></head>
<body><div id="wrap">
  <h1>The recommendation graph</h1>
  <p class="sub">diners and restaurants, joined by 2.5M reviews&nbsp;&nbsp;·&nbsp;&nbsp;5 node types&nbsp;&nbsp;·&nbsp;&nbsp;4 relations</p>
  <svg viewBox="0 0 1120 560">
    <defs>
      <radialGradient id="gteal" cx="35%" cy="28%"><stop offset="0" stop-color="#5cc0ad"/><stop offset="1" stop-color="#258576"/></radialGradient>
      <radialGradient id="gtealL" cx="35%" cy="28%"><stop offset="0" stop-color="#8fd6c9"/><stop offset="1" stop-color="#4aa595"/></radialGradient>
      <radialGradient id="gcoral" cx="35%" cy="28%"><stop offset="0" stop-color="#dd8589"/><stop offset="1" stop-color="#b34a50"/></radialGradient>
      <radialGradient id="gpurp" cx="35%" cy="28%"><stop offset="0" stop-color="#a98ccb"/><stop offset="1" stop-color="#75599c"/></radialGradient>
      <radialGradient id="gslate" cx="35%" cy="28%"><stop offset="0" stop-color="#9aa7ba"/><stop offset="1" stop-color="#697892"/></radialGradient>
      <filter id="sh" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#2a3550" flood-opacity="0.22"/></filter>
      <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
      <marker id="ar" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto"><path d="M0,0 L7.5,3 L0,6 Z" fill="#9aa3ad"/></marker>
      <marker id="arteal" markerWidth="8" markerHeight="8" refX="6.5" refY="3" orient="auto"><path d="M0,0 L6.5,3 L0,6 Z" fill="#258576"/></marker>
    </defs>

    <!-- diner profile feature NODES around the user -->
    <text class="flabel" x="155" y="92" style="font-weight:700;font-size:13px">Diner profile (node features)</text>
    <line class="fedge" x1="176" y1="158" x2="300" y2="262"/>
    <line class="fedge" x1="128" y1="282" x2="296" y2="280"/>
    <line class="fedge" x1="176" y1="402" x2="300" y2="298"/>
    <line class="fedge" x1="300" y1="455" x2="320" y2="318"/>
    <g filter="url(#sh)"><circle cx="155" cy="150" r="24" fill="url(#gtealL)"/></g><text class="flabel" x="155" y="190" style="fill:#37414e">demographics</text>
    <g filter="url(#sh)"><circle cx="108" cy="282" r="24" fill="url(#gtealL)"/></g><text class="flabel" x="108" y="322" style="fill:#37414e">taste preferences</text>
    <g filter="url(#sh)"><circle cx="155" cy="410" r="24" fill="url(#gtealL)"/></g><text class="flabel" x="155" y="450" style="fill:#37414e">dietary affinity</text>
    <g filter="url(#sh)"><circle cx="300" cy="455" r="24" fill="url(#gtealL)"/></g><text class="flabel" x="300" y="495" style="fill:#37414e">home area</text>

    <!-- REVIEWED backbone: teal line + teal arrowhead, aligned to node edges -->
    <line x1="386" y1="280" x2="576" y2="280" stroke="#2f9e8c" stroke-width="6" marker-end="url(#arteal)"/>
    <text x="488" y="256" class="elabel" style="fill:#1f6f60;font-size:14px">REVIEWED · 2.5M</text>
    <text x="488" y="318" style="fill:#2f9e8c;font-size:12.5px;font-style:italic;font-weight:700;text-anchor:middle">collaborative-filtering backbone</text>

    <!-- KG edges with labels rotated along each edge -->
    <text class="kgtitle" x="960" y="78">Knowledge graph</text>
    <line x1="690" y1="252" x2="900" y2="170" class="edge" marker-end="url(#ar)"/>
    <line x1="700" y1="280" x2="958" y2="280" class="edge" marker-end="url(#ar)"/>
    <line x1="690" y1="308" x2="900" y2="390" class="edge" marker-end="url(#ar)"/>
    <text class="elabel" transform="rotate(-21 793 200)" x="793" y="200">SERVES</text>
    <text class="elabel" x="826" y="270">LOCATED_IN</text>
    <text class="elabel" transform="rotate(21 793 360)" x="793" y="360">HAS_CUISINE</text>

    <!-- nodes -->
    <g filter="url(#sh)"><circle cx="340" cy="280" r="46" fill="url(#gteal)"/></g>
    <text class="nl" x="340" y="274" style="font-size:16px">User</text><text class="nsub" x="340" y="294" style="font-size:12px">1.96 M</text>
    <g filter="url(#glow)"><circle cx="640" cy="280" r="56" fill="url(#gcoral)"/></g>
    <text class="nl" x="640" y="273" style="font-size:18px">Restaurant</text><text class="nsub" x="640" y="295" style="font-size:13px">18,879</text>
    <g filter="url(#sh)"><circle cx="940" cy="150" r="44" fill="url(#gpurp)"/></g>
    <text class="nl" x="940" y="144" style="font-size:15px">Dish</text><text class="nsub" x="940" y="162" style="font-size:11.5px">517 K</text>
    <g filter="url(#sh)"><circle cx="998" cy="280" r="38" fill="url(#gslate)"/></g>
    <text class="nl" x="998" y="275" style="font-size:14px">CBG</text><text class="nsub" x="998" y="292" style="font-size:11px">666</text>
    <g filter="url(#sh)"><circle cx="940" cy="410" r="44" fill="url(#gpurp)"/></g>
    <text class="nl" x="940" y="404" style="font-size:14px">Cuisine</text><text class="nsub" x="940" y="422" style="font-size:11.5px">17</text>
  </svg>
</div></body></html>
