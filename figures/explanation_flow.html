<!doctype html>
<html><head><meta charset="utf-8">
<style>
  :root{ --mut:#6c757d; }
  *{ box-sizing:border-box; }
  body{ margin:0; background:#eef1f5; font-family:'Helvetica Neue',Arial,'Liberation Sans',sans-serif; }
  #wrap{ width:1100px; background:#fff; padding:28px 32px 26px; }
  h1{ text-align:center; font-size:27px; color:#222; margin:2px 0 18px; }
  svg{ width:100%; height:580px; display:block; }
  .bl{ fill:#fff; font-weight:700; text-anchor:middle; dominant-baseline:central; }
  .bs{ fill:#eef1f4; text-anchor:middle; dominant-baseline:central; }
  .hdr{ fill:#8a93a0; font-size:13px; font-weight:700; letter-spacing:.6px; }
  .note{ fill:var(--mut); font-size:12.5px; font-style:italic; text-anchor:middle; }
</style></head>
<body><div id="wrap">
  <h1>From a diner's request to an explained recommendation</h1>
  <svg viewBox="0 0 1100 580">
    <defs>
      <linearGradient id="slate" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#74808f"/><stop offset="1" stop-color="#586472"/></linearGradient>
      <linearGradient id="blue"  x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4f95cf"/><stop offset="1" stop-color="#3173ad"/></linearGradient>
      <linearGradient id="teal"  x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#42a797"/><stop offset="1" stop-color="#268070"/></linearGradient>
      <linearGradient id="amber" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ec9a45"/><stop offset="1" stop-color="#d2801f"/></linearGradient>
      <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2.5" stdDeviation="2.5" flood-color="#2a3550" flood-opacity="0.2"/></filter>
      <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#9aa3ad"/></marker>
      <marker id="arS" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#6b7785"/></marker>
      <marker id="arB" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#3173ad"/></marker>
      <marker id="arT" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#268070"/></marker>
      <marker id="arA" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#d2801f"/></marker>
    </defs>

    <!-- recommendation pipeline -->
    <text class="hdr" x="40" y="40">RECOMMENDATION PIPELINE</text>
    <g filter="url(#sh)"><rect x="48"  y="58" width="180" height="62" rx="14" fill="url(#slate)"/></g>
    <text class="bl" x="138" y="82" style="font-size:15px">Diner request</text><text class="bs" x="138" y="102" style="font-size:11px">open app / ask</text>
    <g filter="url(#sh)"><rect x="282" y="58" width="196" height="62" rx="14" fill="url(#slate)"/></g>
    <text class="bl" x="380" y="82" style="font-size:15px">GNN scoring</text><text class="bs" x="380" y="102" style="font-size:11px">rank all restaurants</text>
    <g filter="url(#sh)"><rect x="532" y="58" width="186" height="62" rx="14" fill="url(#slate)"/></g>
    <text class="bl" x="625" y="82" style="font-size:15px">Proximity re-rank</text><text class="bs" x="625" y="102" style="font-size:11px">boost what's near</text>
    <g filter="url(#sh)"><rect x="772" y="58" width="220" height="62" rx="14" fill="url(#slate)"/></g>
    <text class="bl" x="882" y="80" style="font-size:15px">Top-K</text><text class="bl" x="882" y="96" style="font-size:15px">recommendations</text>
    <line x1="228" y1="89" x2="278" y2="89" stroke="#6b7785" stroke-width="2.4" marker-end="url(#arS)"/>
    <line x1="478" y1="89" x2="528" y2="89" stroke="#6b7785" stroke-width="2.4" marker-end="url(#arS)"/>
    <line x1="718" y1="89" x2="768" y2="89" stroke="#6b7785" stroke-width="2.4" marker-end="url(#arS)"/>

    <!-- explanation layer panel -->
    <rect x="36" y="180" width="1028" height="380" rx="20" fill="#f6f8fa" stroke="#dadfe6" stroke-width="1.5"/>
    <text class="hdr" x="58" y="212">EXPLANATION LAYER</text>
    <line x1="882" y1="120" x2="882" y2="180" stroke="#6b7785" stroke-width="2.4" marker-end="url(#arS)"/>
    <text x="906" y="155" style="fill:#8a93a0;font-size:12px;font-style:italic">top-K</text>

    <!-- retrieve -->
    <g filter="url(#sh)"><rect x="78" y="300" width="250" height="130" rx="16" fill="url(#blue)"/></g>
    <text class="bl" x="203" y="346" style="font-size:16px">Retrieve grounding</text>
    <text class="bl" x="203" y="366" style="font-size:16px">facts</text>
    <text class="bs" x="203" y="396" style="font-size:11.5px">history · location ·</text>
    <text class="bs" x="203" y="412" style="font-size:11.5px">taste profile · KG</text>
    <text x="203" y="285" style="fill:#3173ad;font-size:12.5px;font-style:italic;text-anchor:middle">the “R” — cheap, every recommendation</text>

    <!-- template / llm -->
    <g filter="url(#sh)"><rect x="430" y="288" width="262" height="72" rx="14" fill="url(#teal)"/></g>
    <text class="bl" x="561" y="312" style="font-size:15px">Templated explanation</text><text class="bs" x="561" y="334" style="font-size:11.5px">default · all users · instant</text>
    <g filter="url(#sh)"><rect x="430" y="430" width="262" height="72" rx="14" fill="url(#amber)"/></g>
    <text class="bl" x="561" y="454" style="font-size:15px">LLM synthesis (RAG)</text><text class="bs" x="561" y="476" style="font-size:11.5px">on demand · when asked “why?”</text>
    <text x="561" y="528" style="fill:#c07a1c;font-size:12.5px;font-style:italic;text-anchor:middle">the “AG” — grounded in the retrieved facts</text>

    <!-- shown -->
    <g filter="url(#sh)"><rect x="784" y="300" width="252" height="130" rx="16" fill="url(#slate)"/></g>
    <text class="bl" x="910" y="356" style="font-size:16px">Explanation shown</text>
    <text class="bs" x="910" y="382" style="font-size:12px">with the recommendation</text>

    <!-- arrows -->
    <line x1="328" y1="346" x2="424" y2="320" stroke="#3173ad" stroke-width="2.6" marker-end="url(#arB)"/>
    <line x1="328" y1="386" x2="424" y2="462" stroke="#3173ad" stroke-width="2.6" marker-end="url(#arB)"/>
    <line x1="692" y1="320" x2="780" y2="350" stroke="#268070" stroke-width="2.6" marker-end="url(#arT)"/>
    <line x1="692" y1="462" x2="780" y2="392" stroke="#d2801f" stroke-width="2.6" marker-end="url(#arA)"/>
  </svg>
</div></body></html>
